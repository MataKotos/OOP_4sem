<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Цветочные букеты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    async function loadBouquets() {
      const response = await fetch('/bouquets');
      const bouquets = await response.json();
      const list = document.getElementById('bouquet-list');
      list.innerHTML = '';

      if (bouquets.length === 0) {
        list.innerHTML = '<p class="text-muted">Пока нет букетов.</p>';
        return;
      }

      bouquets.forEach(b => {
        const item = document.createElement('div');
        item.className = 'card mb-3 shadow-sm';
        item.innerHTML = `
          <div class="card-body">
            <h5 class="card-title">${b.name} <span class="badge bg-secondary">${b.status}</span></h5>
            <p class="card-text mb-1"><strong>Размер:</strong> ${b.size}</p>
            <p class="card-text mb-1"><strong>Описание:</strong> ${b.description}</p>
            <p class="card-text"><strong>Цена:</strong> ${b.price} ₽</p>
          </div>
        `;
        list.appendChild(item);
      });
    }

    async function addBouquet(event) {
      event.preventDefault();

      const bouquet = {
        name: document.getElementById('name').value,
        size: document.getElementById('size').value,
        price: parseFloat(document.getElementById('price').value),
        description: document.getElementById('description').value,
        status: document.getElementById('status').value
      };

      await fetch('/bouquets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bouquet)
      });

      document.getElementById('bouquet-form').reset();
      await loadBouquets();
    }

    window.onload = loadBouquets;
  </script>
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-4">Список цветочных букетов</h1>

  <div id="bouquet-list" class="mb-5"></div>

  <h2 class="mb-3">Добавить букет</h2>
  <form id="bouquet-form" class="row g-3" onsubmit="addBouquet(event)">
    <div class="col-md-6">
      <label for="name" class="form-label">Название</label>
      <input type="text" class="form-control" id="name" required>
    </div>
    <div class="col-md-6">
      <label for="size" class="form-label">Размер</label>
      <input type="text" class="form-control" id="size" required>
    </div>
    <div class="col-md-4">
      <label for="price" class="form-label">Цена (₽)</label>
      <input type="number" step="0.01" class="form-control" id="price" required>
    </div>
    <div class="col-md-4">
      <label for="status" class="form-label">Статус</label>
      <select class="form-select" id="status" required>
        <option selected disabled value="">Выберите...</option>
        <option>в наличии</option>
        <option>под заказ</option>
        <option>в пути</option>
      </select>
    </div>
    <div class="col-md-4">
      <label for="description" class="form-label">Описание</label>
      <input type="text" class="form-control" id="description" required>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-success">Добавить букет</button>
    </div>
  </form>
</div>
</body>
</html>
